<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c8def2">
  <title>Britain, 30 Shehidans</title>
  <style>
    :root{color-scheme:light;--ink:#203b56;--sub:#67839e;--line:#c2d8eb;--blue:#e8f3fd;--blue2:#c9e0f4;--glass:rgba(245,250,255,.88);--shadow:0 18px 55px rgba(31,62,91,.18)}
    *{box-sizing:border-box}html{min-height:100%;background:#bdd4e9}body{margin:0;min-height:100vh;padding:22px;background:radial-gradient(ellipse at 18% 0%,#eff8ff 0%,transparent 36%),linear-gradient(135deg,#dceaf7,#b6cfe5 55%,#d8e8f5);font:15px/1.5 "Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink)}
    .site-shell{position:relative;max-width:1160px;margin:0 auto;overflow:hidden;border:1px solid rgba(255,255,255,.88);border-radius:16px;background:rgba(242,248,254,.88);box-shadow:var(--shadow)}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:19px 24px;background:linear-gradient(180deg,#fff 0%,#e0effb 100%);border-bottom:1px solid #afcce4}
    .brand-lockup{display:flex;align-items:center;gap:15px}.crown-trigger{width:48px;height:48px;border:1px solid #9dbbd7;border-radius:13px;background:linear-gradient(#fff,#d7e9f8);font-size:30px;color:#577b9b;cursor:pointer}
    .brand-copy h1{font-size:24px;margin:0;font-weight:650}.brand-copy p{color:#6484a1;margin:4px 0 0;font-size:13px}
    .nav-tabs{display:flex;gap:4px;padding:10px 14px;background:linear-gradient(#f4f9fe,#d3e5f4);border-bottom:1px solid #b7cfe4}
    .nav-tab{padding:8px 14px;border:1px solid transparent;border-radius:8px;background:transparent;color:#385d7d;font-weight:600;cursor:pointer}
    .nav-tab.active{background:linear-gradient(#fff,#e6f2fc);border-color:#b2cce2}
    main{padding:24px}
    .hero-card{display:flex;align-items:center;gap:27px;padding:30px 34px;border:1px solid #c2daee;border-radius:13px;background:linear-gradient(110deg,#fff 0%,#e8f4ff 60%,#c8e0f4 100%)}
    .audio-card{margin-top:20px;padding:20px;border:1px solid #c2daee;border-radius:11px;background:#fff;text-align:center}
    audio{width:100%;margin-top:10px}
    .site-footer{padding:13px 21px;border-top:1px solid #c2d8e9;background:linear-gradient(#e6f1fa,#d6e7f5);color:#7793aa;font-size:11px;text-align:center}
  </style>
</head>
<body>
  <div class="site-shell">
    <header class="topbar">
      <div class="brand-lockup">
        <button class="crown-trigger" id="crownTrigger">♛</button>
        <div class="brand-copy">
          <h1>Britain, 30 Shehidans</h1>
          <p>بەریتان، ٣٠ شەهیدان</p>
        </div>
      </div>
    </header>

    <nav class="nav-tabs">
      <button class="nav-tab active">Home / سەرەکی</button>
    </nav>

    <main>
      <div class="hero-card">
        <div>
          <h2>Welcome to Britain, 30 Shehidans</h2>
          <p>Your complete community site running in a single, robust file.</p>
        </div>
      </div>

      <div class="audio-card">
        <h3>Mr. Bean Audio Track</h3>
        <audio controls preload="auto">
          <source src="music.mp4" type="audio/mp4">
          Your browser does not support the audio element.
        </audio>
      </div>
    </main>

    <footer class="site-footer">Britain, 30 Shehidans &copy; 2026</footer>
  </div>

  <script>
    document.getElementById("crownTrigger").addEventListener("click", () => {
      alert("Hidden mission triggered! Welcome, owner.");
    });
  </script>
</body>
</html>
